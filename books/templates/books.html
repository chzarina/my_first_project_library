<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kitoblar Ro'yxati</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8F9FA; /* Ivory/Oqish fon */
            color: #2C3E50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-container {
            background-color: #FFFFF0; /* Ivory (Fil suyagi rangi) */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .btn-gold {
            background-color: #D4AF37; /* Tilla rang */
            color: #fff;
            border: none;
        }
        .btn-gold:hover {
            background-color: #C5A028;
            color: #fff;
        }
        .btn-skyblue {
            background-color: #87CEEB; /* Och havo rang */
            color: #2C3E50;
            border: none;
            font-weight: 500;
        }
        .btn-skyblue:hover {
            background-color: #71BCE2;
            color: #1a252f;
        }
        .header-title {
            color: #2C3E50;
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 10px;
        }
        .list-group-item {
            background-color: #fff;
            border-color: #e2e8f0;
            transition: all 0.2s;
        }
        .list-group-item:hover {
            background-color: #F0F8FF; /* Och havo rangga yaqinroq fon */
        }
    </style>
</head>
<body>
    <div class="container my-5 p-4 custom-container">
        <h1 class="mb-4 header-title">📚 Kitoblar Ro'yxati</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <form method="GET" class="d-flex">
                    <input type="text" name="q" value="{{ q }}" class="form-control me-2" placeholder="Kitob nomini qidirish...">
                    <button type="submit" class="btn btn-gold">Qidirish</button>
                </form>
            </div>
            <div class="col-md-6 text-end">
                <a href="{% url 'create' %}" class="btn btn-skyblue">+ Yangi kitob qo'shish</a>
            </div>
        </div>

        <p class="text-muted">Jami kitoblar soni: <strong>{{ total }}</strong></p>

        <div class="list-group shadow-sm">
            {% for book in books %}
                <div class="list-group-item d-flex justify-content-between align-items-center p-3 mb-2 rounded shadow-sm">
                    <div>
                        <h5 class="mb-1"><a href="{% url 'detail' book.id %}" class="text-decoration-none text-dark fw-bold">{{ book.title }}</a></h5>
                        <small class="text-muted">Qo'shilgan vaqti: {{ book.created_at|date:"Y-m-d H:i" }}</small>
                    </div>
                    <div>
                        <a href="{% url 'update' book.id %}" class="btn btn-sm btn-gold me-1">Tahrirlash</a>
                        <a href="{% url 'delete' book.id %}" class="btn btn-sm btn-outline-danger">O'chirish</a>
                    </div>
                </div>
            {% empty %}
                <div class="list-group-item text-center py-4 text-muted">Hozircha kitoblar mavjud emas.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
