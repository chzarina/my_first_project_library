<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kitobni o'chirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F8F9FA; }
        .card-custom {
            background-color: #FFFFF0; /* Ivory */
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }
        .btn-gold { background-color: #D4AF37; color: #fff; border: none; }
        .btn-gold:hover { background-color: #C5A028; color: #fff; }
    </style>
</head>
<body>
    <div class="container my-5" style="max-width: 500px;">
        <div class="card card-custom shadow border-danger">
            <div class="card-body text-center p-4">
                <h3 class="card-title text-danger mb-3">O'chirishni tasdiqlang</h3>
                <p class="card-text">Haqiqatan ham <strong>"{{ book.title }}"</strong> kitobini o'chirmoqchimisiz?</p>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Ha, o'chirish</button>
                    <a href="{% url 'books' %}" class="btn btn-gold px-4">Bekor qilish</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
